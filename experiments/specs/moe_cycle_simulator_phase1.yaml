dependencies:
  - phase0 ledger 4a53c3d2fbbab330151679ea2b831b91b404239b88db7edc616f2900d61544bc
  - exact dependency root and installed-content inventory recorded per run
validation:
  - exact alignment conversion
  - EventIR dependency and tie-key validation
  - RoutingIR ambiguity validation
  - file and semantic hash replay
  - raw input immutability
  - complete run filesystem closure and special-entry rejection
  - retained validator/test argv, environment, return code, stdout and stderr
acceptance:
  - all required mock shapes represented
  - per-rank alignment records are distinct
  - V0 replay has zero findings
  - gpu_used is false
  - all 16 Phase 1 tests pass in the recorded environment
