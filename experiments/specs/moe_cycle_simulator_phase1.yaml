  - synthetic request/token/kernel/router/allocator/copy events
  - synthetic two-rank collective and P2P events
  - independent telemetry clock
  - exact rational alignment and semantic hashing
non_goals:
  - real vLLM or Mistral execution
  - Mixtral materialization
  - GPU profiling
  - Canonical IR freeze
  - calibration
inputs:
  - explorations/moe_cycle_simulator/phase1/fixtures/mock_runtime_trace.json
