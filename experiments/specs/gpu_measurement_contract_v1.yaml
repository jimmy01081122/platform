schema_version: gpu-measurement-contract-v1
id: gpu_measurement_contract_v1
created_by_track: TRACK_GPU_PREP
created_at: "2026-08-19"
status: FROZEN_PREP2   # PREP-1 froze the 5 base targets; PREP-2 filled all IR eval-point fields against STAGE_A2's CalibrationIR schema
# PREP-3 (OD-4) appended one target below, V2-GAP-A, marked status: FROZEN_PREP3.
# It is additive: none of the five base targets above are modified.
# ---------------------------------------------------------------------------
# Frozen measurement contract for the five GPU measurement priorities.
#
# Purpose (TRACK_GPU_PREP §1): when the GPU window opens, no design decision
# remains -- only execution. The test: hand this to someone with zero project
# context; can they run the measurement? If not, it is not done.
#
# CLAIM BOUNDARY: every time_estimate below is an ESTIMATE derived from frozen
# facts, NOT a measured duration (TRACK_GPU_PREP §7). It exists to size the
# window and order the work, and MUST be validated against the wall clock during
# measurement. exact_argv lines that invoke a GPU/serving backend are for
# TRACK_GPU; they are NOT run in this pure-CPU track.
#
# output_fields that depend on STAGE_A2's IR evaluation-point schema were held
# PENDING_A2 in PREP-1 (hard rule 5 -- guessing them is how GAP-4 was created).
# STAGE_A2 is now COMPLETE, so PREP-2 has FILLED them against A2's actual
# CalibrationIR schema: each measured point carries its operand shape directly in
# evaluation_coordinate, so the IR pipeline builds the point with NO join to raw.
# ---------------------------------------------------------------------------

frozen_platform_facts:
  gpu: "NVIDIA RTX PRO 6000 Workstation Edition 96 GB"
  model: "mistralai/Mixtral-8x7B-Instruct-v0.1"
  revision: eba92302a2861cdc0098cc54bc9f17cb2c47eb61
  runtime: "vLLM 0.23.0"
  kv_bytes_per_token: 131072          # 128 KiB (SWAP-K2: 2,097,152 B block / 16 tokens)
  kv_block_bytes: 2097152
  kv_block_tokens: 16
  expert_object_bytes: 352321536      # 336 MiB (OFF-E-PR3)
  vram_bytes_nominal: 96000000000
  h2d_per_object_ms_measured: [12.454, 12.499]   # OFF-E-PR3, 14 non-zero points
  serving_anchor_rate_rps: 1.0472460793856333    # SERV-P0-25 Poisson open-loop

attempt_evidence_contract:
  wrapper: "python3 measurement/run_gpu_attempt.py --attempt-dir /workspace/runs/<attempt_id> --target <target_id> --model-identity-json /workspace/model_identity/<verified-manifest>.json --input-fixture-json <pre-run-input-fixture.json> -- <exact-probe-argv-with---out-inside-attempt-dir>"
  pull: "measurement/pull_gpu_attempt.sh <ssh-host> <ssh-port> /workspace/runs/<attempt_id> /home/a/platform/runs/<attempt_id>"
  applies_to: [target_1, target_2, target_4, target_v2_gap_a]
  target_5_note: "serv_p0_25_arrival_driver.py creates and checksums its own complete attempt root"
  required_identity:
    - exact argv and resolved config
    - stdout/stderr and terminal failure classification
    - pre/post GPU identity and compute-process inventory
    - "CUDA_HOME/CUDA_PATH/CUDACXX/CPATH/LIBRARY_PATH/LD_LIBRARY_PATH"
    - "actual nvcc path + nvcc --version + CUDA_HOME/include/nvrtc.h existence"
    - "VLLM_USE_SIMPLE_KV_OFFLOAD recorded explicitly, including null when unset"
    - model revision and checksum manifest
    - input fixture, raw timings, and telemetry
  safety: "failed attempts are immutable evidence; stop is allowed, destroy/recycle is forbidden while workspace_is_volume=false"
  enforcement: >
    The wrapper rejects a pre-existing compute app, streams stdout/stderr while
    the child runs, samples GPU telemetry periodically, validates the pinned
    model manifest and input fixture, and refuses rc=0 if the declared --out is
    outside the attempt or lacks runtime identity/raw timings.

model_identity_preflight:
  generator: "python3 measurement/model_identity_manifest.py --model-path <pinned-model-path> --model-id mistralai/Mixtral-8x7B-Instruct-v0.1 --revision eba92302a2861cdc0098cc54bc9f17cb2c47eb61 --output /workspace/model_identity/<fresh-id>.json"
  rule: "run once after every start before the first GPU attempt; hashes config, safetensors index, and all 19 shards (93,405,713,504 bytes); no PASS manifest is written on any mismatch"
  current_status: "generator CPU-tested; full 93.4-GB content pass NOT_RUN because instance 48381628 is stopped"

targets:

  - id: target_1
    priority: 1
    target: "A2 -- MoE dispatch data movement (in-serving)"
    rationale: >
      The only primary mount point with no independent measurement. The existing
      gather_scatter probe (benchmark.py:463) is a same-device synthetic proxy
      giving only the execute term; it omits T_prepare/T_queue/T_sync/T_move.
      What is missing is the system-level movement + control structure of
      dispatch inside a live serving loop.
    probe: measurement/probes/inserving_dispatch_probe.py
    parser: measurement/parsers/dispatch_parser.py
    independent_vars:
      concurrency: [1, 2, 4, 8]
      # range chosen to span the serving anchor (concurrency 8, SERV-P0-25) down
      # to the single-request residency regime the existing evidence lives in.
      decode_steps_per_point: 128
      # 128 steps >> one MoE layer's dispatch, enough to estimate per-dispatch
      # bytes and frequency without a full generation.
      engine_domain:
        max_num_seqs: 8
        max_model_len: 4096
        max_num_batched_tokens: 1024
        gpu_memory_utilization: 0.97
        enforce_eager: true
        dtype: bfloat16
        tensor_parallel_size: 1
        pipeline_parallel_size: 1
        enable_prefix_caching: false
      max_num_batched_tokens_provenance: >
        Explicit CLI/config value in the existing SERV-P0-25 C8 anchor and the
        2026-08-22 HEADERFIX canary; it is not a runner default
        (gpu_campaign_runner defaults 256, serving_burst_runner defaults 512).
        Owner froze 1024 for target_1.
    sample_size: "128 instrumented decode steps per concurrency point"
    repeats: "3 serving windows per concurrency; report per-step distribution"
    stop_condition: "all concurrency points have >=128 clean instrumented steps"
    failure_condition: >
      serving process not owned by this session (STOP, do not interfere);
      instrumentation perturbs serving latency > 5% vs uninstrumented control
      (record and flag; do not silently keep). Retry a transient failure once.
    output_fields:
      measured_directly:
        - dispatch_bytes            # per dispatch, gather-in + scatter-out
        - move_granularity_bytes
        - dispatch_period_ns        # frequency
        - control_decisions         # routing/permutation decisions per dispatch
        - expert_tokens
      # FILLED in PREP-2 against STAGE_A2's CalibrationIR schema:
      break_even_decomposition:     # root spec 10.4, per dispatch
        - T_prepare_ns
        - T_queue_ns
        - T_sync_ns
        - T_move_ns
      ir_evaluation_point:
        schema: CalibrationIR       # explorations/.../canonical_ir.schema.json $defs.calibration
        evaluation_coordinate: [expert_tokens, concurrency]   # operand shape carried DIRECTLY (no join; closes GAP-4)
        metrics: [dispatch_bytes, dispatch_control_decisions, dispatch_T_prepare, dispatch_T_queue, dispatch_T_sync, dispatch_T_move]
        generator: measurement/probes/ir_evaluation_point.py::dispatch_result_to_points
    exact_argv:
      cpu_smoke_test: "python3 measurement/probes/inserving_dispatch_probe.py --backend mock_dispatch --concurrency 1,2,4,8 --steps 128 --out runs/<run_id>/dispatch_smoke.json"
      gpu_run: "python3 measurement/probes/inserving_dispatch_probe.py --backend vllm_dispatch --concurrency 1,2,4,8 --steps 128 --repeats 3 --model-path <pinned-model-path> --runtime-adapter-module measurement.probes.vllm_runtime_adapter --out /workspace/runs/<attempt_id>/artifacts/dispatch.json   # TRACK_GPU only"
    implementation_status: >
      ENGINE_CONTROL_READY on CPU/source audit, live control audit NOT_RUN.
      The strict adapter can create the frozen engine, inject worker_extension_cls,
      use collective_rpc, resolve config, and preserve startup markers. It refuses
      measurement because FlashInferExperts.apply exposes one fused CUTLASS MoE
      boundary, so T_move cannot be isolated from T_execute. The frozen <=5%
      perturbation control is also mandatory. No measured PASS is possible until
      owner authorizes lower-level instrumentation or changes the output contract.
    time_estimate:
      basis: "model load ~90s (amortized once) + ~2 min serving window per concurrency point x 4 x 3 repeats, warmup included"
      estimate_minutes: 25
      note: ESTIMATE_NOT_MEASURED

  - id: target_2
    priority: 2
    target: "A6 -- long-context offloaded-KV attention"
    rationale: >
      No evidence at all; highest information gain. Whole-repo grep of
      max_model_len/cpu_offload_gb/swap_space/kv_offload is zero hits, so the
      runner+parser are written from scratch. The sweep must cross the point
      where KV stops fitting in VRAM and is forced to offload.
    probe: measurement/probes/long_context_kv_probe.py
    parser: measurement/parsers/longctx_kv_parser.py
    independent_vars:
      seq_lens: [4096, 16384, 65536, 131072, 262144, 524288, 1048576]
      runtime_variant: "offload-on (independent storage/name; not canonical M0)"
      kv_offloading_backend: native
      kv_offloading_size_gb:
        mechanism_canary: 16
        formal_sweep: 140
      VLLM_USE_SIMPLE_KV_OFFLOAD: "UNSET (record as null in runtime identity)"
      max_num_batched_tokens: 32768
      max_num_batched_tokens_provenance: >
        M0 canonical value (explorations/moe_cycle_simulator/phase7/application/
        m0_execution_contract.json: max_batched_tokens=32768, paired with
        max_sequences=1). Chosen for target_2 specifically because this target's
        workload is a single huge-sequence prefill (up to 1,048,576 tokens) whose
        purpose is to cross the KV offload boundary -- capping the per-step token
        budget at target_1's 1024 (frozen for a DIFFERENT reason: matching the
        SERV-P0-25 C8 serving anchor) would force many more chunked-prefill steps
        than the canonical single-sequence domain uses, changing what TTFT means
        for this target. 32768 is the minimal deviation from M0 canonical.
      enable_prefix_caching: false
      enable_prefix_caching_provenance: >
        evidence/ scan: 288/288 AsyncEngineArgs dumps with a prefix-caching field
        record enable_prefix_caching=False, zero exceptions. Also a technical hard
        requirement, not just a convention match: prefix-caching deduplicates KV
        blocks across requests, which would violate _validate_longctx_record's
        exact conservation identity kv_total_bytes == seq_len * 131072 -- the
        measurement this target exists to take assumes every token's KV is
        resident-or-offloaded exactly once.
      mechanism_canary_seq_len: 131072
      mechanism_canary_seq_len_provenance: >
        131072 tokens x 131072 B/token = 17,179,869,184 bytes = exactly 16 GiB,
        matching the mechanism_canary kv_offloading_size_gb=16 capacity exactly
        (both are 2^17 x 2^17 = 2^34). It is also the sweep's 4th of 7 points
        (the middle value). Chosen so the cheap canary exercises the offload
        mechanism at the exact boundary its declared capacity is sized for,
        rather than trivially under- or over-shooting it.
      offload_boundary_derivation: >
        KV = 131072 B/token. Pure-KV bound alone: 1,048,576 tokens x 128 KiB =
        128 GiB > 96 GB VRAM, so offload is forced at the top of the sweep
        regardless of weight residency. The true knee = (VRAM free for KV) /
        128 KiB; the free budget depends on weight residency, which is NOT
        measured here, so the sweep spans well below and above every plausible
        knee and the runner records actual free VRAM to let measurement locate
        it. Validate the estimate at measurement time; do not assume it.
    sample_size: "one prefill + fixed decode window per seq_len"
    repeats: "3 per seq_len (TTFT and per-token latency distribution)"
    stop_condition: "sweep_crossed_offload_boundary == true AND every non-OOM seq_len has 3 repeats"
    failure_condition: >
      OOM: record the failure and STOP the sweep. Do NOT shorten the sequence,
      enable a different offload path, or relax a threshold to make it run --
      that is an owner decision (TRACK_GPU_PREP §8). An OOM before the boundary
      is crossed is itself a reportable result, not a probe bug.
    output_fields:
      measured_directly:
        - ttft_ns
        - decode_per_token_ns
        - kv_resident_bytes
        - kv_offloaded_bytes
        - kv_offloaded_blocks
        - offload_engaged
        - kv_move_ns
        - kv_move_bytes
      # FILLED in PREP-2 against STAGE_A2's CalibrationIR schema:
      ir_evaluation_point:
        schema: CalibrationIR
        evaluation_coordinate: [seq_len]      # operand shape carried DIRECTLY (no join)
        metrics: [longctx_ttft, longctx_decode_per_token, longctx_kv_move, longctx_kv_offloaded_bytes]
        generator: measurement/probes/ir_evaluation_point.py::longctx_result_to_points
    exact_argv:
      cpu_smoke_test: "python3 measurement/probes/long_context_kv_probe.py --backend mock_longctx --seq-lens 4096,16384,65536,131072,262144,524288,1048576 --kv-budget-bytes 8000000000 --out runs/<run_id>/longctx_smoke.json"
      mechanism_canary: "env -u VLLM_USE_SIMPLE_KV_OFFLOAD python3 measurement/probes/long_context_kv_probe.py --backend vllm_longctx_offload_on --seq-lens 131072 --kv-offloading-size-gb 16 --kv-offloading-backend native --max-num-batched-tokens 32768 --no-enable-prefix-caching --max-model-len 1048576 --model-path <pinned-model-path> --runtime-adapter-module measurement.probes.vllm_runtime_adapter --out /workspace/runs/<attempt_id>/artifacts/longctx_canary.json"
      gpu_run: "env -u VLLM_USE_SIMPLE_KV_OFFLOAD python3 measurement/probes/long_context_kv_probe.py --backend vllm_longctx_offload_on --seq-lens 4096,16384,65536,131072,262144,524288,1048576 --kv-offloading-size-gb 140 --kv-offloading-backend native --max-num-batched-tokens 32768 --no-enable-prefix-caching --max-model-len 1048576 --model-path <pinned-model-path> --runtime-adapter-module measurement.probes.vllm_runtime_adapter --out /workspace/runs/<attempt_id>/artifacts/longctx.json   # TRACK_GPU only"
      claim_boundary: "16-GiB canary proves only that the mechanism can trigger; it is not an offload performance validation"
    implementation_status: >
      ENGINE_CONTROL_READY on CPU/source audit, live control audit NOT_RUN.
      Native OffloadingConnectorStats exposes transfer bytes/time but drains and
      resets its accumulator and exposes no per-request GPU/CPU resident-byte
      gauge. The strict adapter therefore refuses the frozen direct-residency
      fields; it does not infer residency. Full sweep and P-020 values remain
      unchanged. Owner must decide lower-level connector instrumentation.
    time_estimate:
      basis: "model load ~90s + prefill cost grows with seq_len; 1M-token prefill with offload dominates (multiple minutes/repeat). 7 lengths x 3 repeats, offloaded points slowest."
      estimate_minutes: 60
      uncertainty: "HIGH -- long-prefill + offload wall-clock is the least constrained estimate; validate early and re-plan"
      note: ESTIMATE_NOT_MEASURED

  - id: target_3
    priority: 3
    target: "sealed held-out validation split (STAGE_A4 steps 1-2)"
    rationale: >
      A4 prerequisite. The split must be sealed BEFORE measurement -- data already
      generated and seen cannot be honestly sealed (root spec §7.2).
    deliverable: calibration/sealed/holdout_split_v1_manifest.json
    validator: measurement/parsers/sealed_manifest_validator.py
    independent_vars:
      note: >
        The split assigns measurement condition-cells (PCIe multi-stream small+
        large, component operand-shape, replay concurrency) to fit/validation/
        holdout, targeting the four STAGE_A1 defects. See the manifest.
    sample_size: "102 condition-cells (fit=64, validation=18, holdout=20)"
    repeats: "n/a -- this is a design+seal step, not a measurement"
    stop_condition: "manifest written, per-cell SHA-256 + assignment hash recorded, validator passes"
    failure_condition: "assignment or per-cell hash mismatch on re-audit => seal is void, re-seal"
    output_fields:
      measured_directly:
        - "sealed cell->split assignment (committed pre-measurement)"
      pending_measurement: "measured values of held-out cells -- filled by TRACK_GPU, scored once by STAGE_A4"
    exact_argv:
      seal: "python3 calibration/sealed/build_holdout_split_v1.py"
      audit: "python3 measurement/parsers/sealed_manifest_validator.py calibration/sealed/holdout_split_v1_manifest.json"
    time_estimate:
      basis: "sealing is pure-CPU and already done; GPU cost = measuring the held-out cells, folded into target_4 + PCIe sweep"
      estimate_minutes: 0
      note: SEALED_IN_PREP1

  - id: target_4
    priority: 4
    target: "component service model gaps (operand shape + concurrency)"
    rationale: >
      Per A1 residual analysis. Full spec: calibration/fits/v2/measurement_gaps.json
      (6 gaps). GAP-5 is resolved by code reading this track (see
      calibration/GAP5_LAUNCH_GRANULARITY_RESOLUTION.md) and does NOT need GPU.
    parser: measurement/parsers/component_eval_parser.py
    phase2_probes:
      component_shape: measurement/probes/component_shape_probe.py
      v2_gap_c_sort_permute: measurement/probes/sort_permute_probe.py
      gap1_dequant_weight_bytes: measurement/probes/dequant_weight_bytes_probe.py
    phase2_strict_parsers:
      component_shape: measurement/parsers/component_shape_parser.py
      v2_gap_c_sort_permute: measurement/parsers/sort_permute_parser.py
      gap1_dequant_weight_bytes: measurement/parsers/dequant_weight_bytes_parser.py
    gaps:
      GAP-1: "dequant weight-bytes sweep at fixed token count (needs GPU)"
      GAP-2: "aggregate multi-stream contention end-to-end (needs GPU, transfers list populated)"
      GAP-3: "more repeated small-size (4KiB) transfer samples for floor CI (needs GPU)"
      GAP-5: "RESOLVED_BY_CODE -- launch-granularity mapping documented; residual 1.87x is a distinct unmeasured argsort operator = V2-GAP-C"
      GAP-6: "size-dependent stream interaction: small-transfer latency grows with streams (needs GPU)"
      GAP-4: "component eval points must carry expert_tokens directly (schema fix, verified by parser --enforce-gap4)"
      V2-GAP-B: "denser prefill operand-shape sweep (KNN did not generalize; needs GPU)"
      V2-GAP-C: "sort/permute microbenchmark for the two window_replay argsorts (needs GPU)"
    independent_vars:
      component_expert_tokens: [8, 16, 32, 64, 128, 256, 512, 1024]
      component_ops: [selected_expert, grouped_gemm, gather_scatter, dequant]
      phases: [prefill, decode]
      pcie_bytes: [4096, 65536, 1048576, 16777216, 88080384]
      pcie_streams: [1, 2, 4]
      pcie_directions: [h2d, d2h]
    sample_size: >
      n=5 per cell. Component cells are isolated by the precommitted sealed
      assignment: fit=41, validation=11, holdout=12; holdout requires a separate
      STAGE_A4-authorized attempt and must never be fed to FIT.
    repeats: "5 inner, reported with Student-t CI"
    stop_condition: "all cells measured with n=5; V2-GAP-C sort/permute probe measured"
    failure_condition: "non-physical fit (slope<=0 or intercept<0) => reject, do not fall back to a constant (root spec §8.3)"
    output_fields:
      measured_directly:
        - "expert_tokens (carried directly per GAP-4 fix)"
        - measured_latency_ms
        - gpu_operations
        - copy_streams
        - direction
        - bytes
      # FILLED in PREP-2: component/pcie eval points map to CalibrationIR with the
      # operand shape carried DIRECTLY in evaluation_coordinate (the GAP-4 fix,
      # enforced by component_eval_parser.py --enforce-gap4):
      ir_evaluation_point:
        schema: CalibrationIR
        component_coordinate: [expert_tokens, phase, concurrency]
        pcie_coordinate: [bytes, copy_streams, direction]
        note: "component_eval_parser --enforce-gap4 fails any component point lacking expert_tokens"
    exact_argv:
      legacy_harness_note: "the checksum-frozen gpu_run_package_v2 output is retained only as legacy evidence; it is not the Phase 2 measurement standard"
      component_shape_fit: "python3 measurement/probes/component_shape_probe.py --backend gpu --expert-tokens 8,16,32,64,128,256,512,1024 --sealed-manifest calibration/sealed/holdout_split_v1_manifest.json --split fit --repeats 5 --warmup 10 --minimum-inner-seconds 1.0 --out /workspace/runs/<attempt_id>/artifacts/component_shape_fit.json"
      component_shape_validation: "python3 measurement/probes/component_shape_probe.py --backend gpu --expert-tokens 8,16,32,64,128,256,512,1024 --sealed-manifest calibration/sealed/holdout_split_v1_manifest.json --split validation --repeats 5 --warmup 10 --minimum-inner-seconds 1.0 --out /workspace/runs/<attempt_id>/artifacts/component_shape_validation.json"
      component_shape_holdout_A4_only: "python3 measurement/probes/component_shape_probe.py --backend gpu --expert-tokens 8,16,32,64,128,256,512,1024 --sealed-manifest calibration/sealed/holdout_split_v1_manifest.json --split holdout --authorize-holdout-measurement --repeats 5 --warmup 10 --minimum-inner-seconds 1.0 --out /workspace/runs/<attempt_id>/artifacts/component_shape_holdout.json"
      component_shape_check: "python3 measurement/parsers/component_shape_parser.py /workspace/runs/<attempt_id>/artifacts/component_shape_<fit-or-validation-or-holdout>.json"
      v2_gap_c_sort_permute: "python3 measurement/probes/sort_permute_probe.py --backend gpu --expert-tokens 8,16,32,64,128,256,512,1024 --repeats 5 --warmup 10 --minimum-inner-seconds 1.0 --out runs/<attempt_id>/sort_permute.json"
      v2_gap_c_check: "python3 measurement/parsers/sort_permute_parser.py runs/<attempt_id>/sort_permute.json"
      gap1_dequant_weight_bytes: "python3 measurement/probes/dequant_weight_bytes_probe.py --backend gpu --weight-bytes <owner-approved-grid> --fixed-expert-tokens <owner-approved-value> --repeats 5 --warmup 10 --minimum-inner-seconds 1.0 --out runs/<attempt_id>/dequant_weight_bytes.json"
      gap1_check: "python3 measurement/parsers/dequant_weight_bytes_parser.py runs/<attempt_id>/dequant_weight_bytes.json"
      gap4_parser_check: "python3 measurement/parsers/component_eval_parser.py <eval_points.json> --enforce-gap4"
      remaining_owner_inputs: "GAP-1 weight_bytes grid and fixed_expert_tokens; probe refuses to guess either"
    time_estimate:
      basis: "component microbenchmarks are ms-scale x n=5; model/tensor setup ~90s; PCIe sweep 30 cells; component sweep 64 cells; sort/permute probe small"
      estimate_minutes: 15
      note: ESTIMATE_NOT_MEASURED

  - id: target_5
    priority: 5
    target: "SERV-P0-25 tail-CI supplement"
    rationale: >
      Rerun the full 10K from request 0 with a NEW attempt ID; must NOT resume
      any existing partial progress (root spec §9.1 priority 5). P-021 fixes the
      implementation as an independent arrival-driver wrapper around the unchanged
      historical open-loop executor; gpu_campaign_runner.py itself remains untouched.
    driver: measurement/probes/serv_p0_25_arrival_driver.py
    execution_runner: explorations/moe_cycle_simulator/phase7/real_run/serving_burst_runner.py
    execution_runner_sha256: f948a2920fa17eb7448ddaf3395e53f325db7527c1ca18b5d60bff379d1c144a
    provenance_runner: explorations/moe_cycle_simulator/phase7/real_run/gpu_campaign_runner.py
    provenance_runner_sha256_current: 30d3384a61b5afc3cf1dee96f8267c6411ca937d1f35a5b7509fa17336d6419c
    provenance_runner_sha256_archived: 304a7e2ce72f4d8c24390f292e4bc5e426c2ecac39f8a7824e575355dc8adae8
    runner_mutation: FORBIDDEN
    parser: measurement/parsers/serving_tail_parser.py
    independent_vars:
      requests: 10000
      arrival: "Poisson open-loop, rate 1.0472460793856333 rps, seed 20260812"
      concurrency: 8
      shape: "128-in / 32-out"
      max_num_batched_tokens: 1024
    sample_size: "10000 requests, single full run"
    repeats: "1 (a full 10K run); tail CI comes from the 10K sample, not repeats"
    stop_condition: "10000/10000 requests completed from index 0 with a fresh attempt_id"
    failure_condition: >
      resumed_partial_progress == true => INVALID, discard and restart from 0.
      Non-monotone percentiles => instrumentation error, investigate.
    output_fields:
      measured_directly:
        - "completion_latency p50/p95/p99/max"
        - attempt_id
        - start_request_index
        - resumed_partial_progress
        - "per-request TTFT + monotonic ns timestamps + input/output SHA-256"
    exact_argv:
      gpu_run: "python3 measurement/probes/serv_p0_25_arrival_driver.py --attempt-id SERV-P0-25-TAIL-<UTC>-TRACKGPU --run-root /workspace/runs --model-path <pinned-model-path> --model-identity-json <verified-model-identity.json> --python-executable <vllm-0.23-venv>/bin/python"
      note: "P-021 path B: driver freezes 10K/rate/seed/C8/128-in/32-out and starts at request 0; serving_burst_runner.py is the hash-pinned open-loop executor; gpu_campaign_runner.py remains untouched and provenance-only"
      parser_check: "python3 measurement/parsers/serving_tail_parser.py <serving_result.json>"
    time_estimate:
      basis: >
        Poisson open-loop at 1.0472 rps is ARRIVAL-BOUND: 10000 / 1.0472 ~= 9550 s
        ~= 2.65 h wall-clock regardless of concurrency. This dominates the window
        budget and cannot be shortened without changing the arrival process
        (which would change what is measured).
      estimate_minutes: 160
      note: ESTIMATE_NOT_MEASURED

  # =========================================================================
  # PREP-3 (OD-4) APPENDED TARGET -- V2-GAP-A. Additive; the five targets above
  # are unchanged. Frozen for the same GPU window per statuts OD-4.
  # =========================================================================
  - id: target_v2_gap_a
    status: FROZEN_PREP3
    priority: 4                          # same information-gain tier as target_4 (component/PCIe gaps)
    depends_on_decision: OD-4
    target: "V2-GAP-A -- multi-object concurrent transfer (aggregate completion; defines two-regime S>1 production semantics)"
    source_spec: "experiments/specs/cal_model_form_repair_v2.yaml measurement_gaps_opened.V2-GAP-A-MULTISTREAM-AGGREGATE (+ OWNER_RESOLUTION_2026_08_18 candidate_a clarifications)"
    rationale: >
      The two-regime PCIe model (candidate_a) predicts a single residency-managed
      object with copy_streams S=1; the intra-object S>1 case is production-
      UNSUPPORTED because predict() must not extrapolate the microbenchmark's
      chunk-split O_d(S) to real transfers (OWNER_RESOLUTION 2026-08-18). Defining
      the S>1 production semantics requires the ONE quantity no evidence family
      currently carries: the aggregate (wait-all) completion time of N INDEPENDENT
      objects moved concurrently. That is multi-object copy concurrency -- a
      DIFFERENT axis (num_objects), which per the owner resolution must NOT be
      expressed with S. This target sweeps num_objects with copy_streams fixed at 1.
    boundary_vs_existing_gaps: >
      Distinct from the intra-object S / copy_streams axis that GAP-2 and GAP-6
      live on: GAP-2 = the aggregate-contention interpretation of the existing
      copy_engine(S) probe is untested because no eval point has a non-empty
      transfers list; GAP-6 = single-transfer latency growing with copy_streams S
      at small size. Both are intra-object-S questions. V2-GAP-A is the multi-
      object (num_objects) axis and touches neither; it is also distinct from
      GAP-1 (dequant weight-bytes) and GAP-3 (small-transfer floor sample size).
    probe: measurement/probes/multistream_aggregate_probe.py
    parser: measurement/parsers/multistream_aggregate_parser.py
    cpu_backend: measurement/probes/aggregate_backend.py   # mock_aggregate; pure-CPU smoke only
    independent_vars:
      num_objects: [1, 2, 4, 8]
      # multi-object copy concurrency N (NOT copy_streams S). Range spans the
      # single-object production case (N=1) up to the serving anchor concurrency
      # (8, SERV-P0-25), so the aggregate curve covers the residency regime the
      # existing evidence lives in.
      object_bytes: [65536, 2097152, 352321536]
      # 64 KiB small-regime anchor + the two real production residency objects
      # (KV block 2 MiB, expert 336 MiB). Spans small / transition / bulk so the
      # measurement can locate the two-regime knees at multi-object concurrency.
      direction: [h2d, d2h]
      copy_streams_fixed: 1
      # HARD: each object is a single S=1 transfer. The parser rejects any cell
      # with copy_streams != 1 -- the S axis must not be borrowed for this axis.
    sample_size: "n=5 per cell (matches the q0 convention; same as target_4)"
    repeats: "5 inner repeats per cell, reported with Student-t CI"
    stop_condition: "every (num_objects x object_bytes x direction) cell has n=5 clean aggregate samples"
    failure_condition: >
      Non-physical aggregate -- aggregate_completion_ms < max(per_object_ms), or
      > sum(per_object_ms) -- => reject the cell (parser raises); it cannot finish
      before its slowest constituent nor exceed running them serially. A cell
      recorded with copy_streams != 1 is an AXIS error (multi-object concurrency
      mis-encoded as intra-object S) => reject, do not silently accept. Retry a
      transient failure once.
    output_fields:
      measured_directly:
        - num_objects
        - object_bytes
        - direction
        - copy_streams            # always 1 (axis guard)
        - regime                  # small / transition / bulk (from object_bytes)
        - aggregate_completion_ms_samples   # n=5
        - aggregate_completion_ms_mean
        - per_object_ms
        - max_per_object_ms
        - sum_per_object_ms
      ir_evaluation_point:
        schema: CalibrationIR
        status: PENDING
        pending_field: ir_evaluation_point_fields
        pending_sentinel: PENDING_S_GT_1_SEMANTICS
        reason: >
          Left PENDING, NOT guessed (the GAP-4 lesson). The S>1 aggregate ->
          production-coordinate mapping is exactly the item this gap opens and is
          production-UNSUPPORTED today, so the projection into a CalibrationIR
          evaluation_coordinate is not determinable from existing data. TRACK_GPU
          fills it only after the measurement resolves the S>1 semantics; until
          then the probe emits ir_evaluation_point_fields=PENDING_S_GT_1_SEMANTICS
          and production_stream_semantics_status=UNSUPPORTED_UNTIL_MEASURED.
    exact_argv:
      cpu_smoke_test: "python3 measurement/probes/multistream_aggregate_probe.py --backend mock_aggregate --num-objects 1,2,4,8 --object-bytes 65536,2097152,352321536 --direction h2d,d2h --repeats 5 --out runs/<run_id>/v2gapa_smoke.json"
      parser_check: "python3 measurement/parsers/multistream_aggregate_parser.py runs/<run_id>/v2gapa_smoke.json"
      gpu_run: "python3 measurement/probes/multistream_aggregate_probe.py --backend gpu --num-objects 1,2,4,8 --object-bytes 65536,2097152,352321536 --direction h2d,d2h --repeats 5 --out /workspace/runs/<attempt_id>/artifacts/v2gapa.json   # TRACK_GPU only"
    measurement_status: >
      PASS on 20260822T121400Z__track_gpu_v2gapa_multistream_attempt2: 24
      unique cells x n=5, copy_streams=1, strict parser and exact-grid audit PASS.
      Attempt1 parser failure is preserved. FIT-side only; IR/production mapping
      remains PENDING_S_GT_1_SEMANTICS / UNSUPPORTED_UNTIL_MEASURED.
    time_estimate:
      basis: >
        Same class as target_4: PCIe transfer microbenchmark, ms-scale x n=5.
        24 cells (4 num_objects x 3 sizes x 2 directions) x 5 repeats; tensor/
        pinned-buffer setup ~small; folded into the same window as target_4's
        PCIe sweep. Slightly larger than target_4's PCIe portion alone because it
        adds the multi-object dimension.
      estimate_minutes: 12
      note: ESTIMATE_NOT_MEASURED
