addenda:
  - id: ADDENDUM_1_CONTENTION_DOUBLE_COUNT
    added_at_utc: "2026-08-17T17:31:56Z"
    reason: >
      殘差分析執行後（見 calibration/fits/v2/residual_report.json 第一版），
      發現 decode phase / concurrency=4 的 component_latency 點系統性地被
      高估約 5-6 倍。追查發現：既有的 contention.per_extra_concurrency
      （≈1.0046）是從一個「shape 固定、只有 concurrency 變化」的探針
      （calibration_role=contention，fixed_expert_tokens=32，concurrency=4）
      擬合出來的，代表的是「相同工作量下、多個並行 stream 競爭同一資源」的
      真實競爭效應。但在本次新增的 tokens_per_launch 仿射模型中，
      concurrency 同時也驅動了 tokens_per_launch 的成長（decode:
      concurrency 1→4 對應 tokens 1→4 或 8→32），兩者疊加即是對同一個
      concurrency 效應「算了兩次」。
    fix: >
      _component_latency() 新增規則：當 features 提供 "tokens"（即
      tokens_per_launch 模型已生效）時，不再套用 contention.per_extra_concurrency
      的乘數；只有在完全無 shape 訊號（tokens_per_launch 退化為 reference
      shape=1）時才沿用舊制的全域 contention 乘數。此規則不影響既有 pytest
      固定資料（其唯一非 1 的 concurrency 案例中 features 恆帶 "tokens"，且
      concurrency=1 時乘數本就是 1，兩種路徑數值相同）。
    status: "本階段登記變更；非事前遺漏，是殘差分析驅動的模型形式修正，依 guide §8 規則補登記。"
    caveat: >
      這不代表 contention 效應本身不存在——只代表「fixed-shape 探針測得的
      競爭係數」不能直接套用在「shape 隨 concurrency 增長」的評估點上。真正
      需要的是「扣除 batching 已解釋的部分後，剩餘的純競爭效應」，但目前的
      量測家族無法把這兩個效應分離（只有一個 contention 探針樣本）。此為
      未收斂項目，記錄於 measurement_gaps。

  - id: ADDENDUM_2_NONPHYSICAL_REJECTION_HARDENING
    added_at_utc: "2026-08-18T00:00:00Z"
    reason: >
      2026-08-18 Principal Reviewer 獨立覆核發現 P0 calibration-safety 違約：
      fit_parameters() 對 gpu_service 仿射回歸包了 try/except，_line_fit 判定
      非物理後被 catch 並改回 flat 常數（dequant 踩到此路徑）。這違反 root spec
      §8.3 與 calibration/README.md 承諾的「拒絕非物理擬合、無 fallback 常數」。
      原 DEFECT_2 的 fit_rule 描述含糊地寫「回歸被拒絕時退回 flat mean」，該措辭
      是此漏洞的來源。
    fix: >
      1. 新增模組層級名單 SHAPE_INSENSITIVE_OPERATIONS = frozenset({"dequant"})。
         名單內 op 事前排除於仿射嘗試之外，直接 flat mean，model_form=
         "flat_by_registered_exclusion"（labeled PROXY_ONLY）。
      2. 名單外 op 若 _line_fit 判定非物理（slope<=0 或 intercept<0），CalibrationError
         一律往外拋，不再 catch、不再 fallback 常數。
      3. calibration/refit_v2.py 的 self-check 擴充覆蓋 production path
         (fit_parameters)，新增 fit_parameters_non_physical_non_excluded（必須 raise）
         與 control fit_parameters_excluded_operation_is_flat_not_error（dequant 不 raise）。
    followup_2026_08_18_single_shape_hardening: >
      P0 follow-up：同一契約漏洞的第二個出口是「single-shape fallback」。原
      fit_parameters() 對名單外 op 若只有 <2 個 distinct shape 值，會退回
      flat_fallback_single_shape_group 常數——與 non-physical fallback 同一類違約。
      現移除該 production fallback：名單外 op 若 distinct shape axis < 2，
      fit_parameters() 一律 raise CalibrationError（若某 op 真的無 shape 依賴，
      必須顯式加入 SHAPE_INSENSITIVE_OPERATIONS 作為 labeled 決策，不得於擬合時
      靜默降級）。self-check 新增 fit_parameters_single_shape_non_excluded（必須
      raise）；保留 negative-slope raise、negative-intercept raise、dequant
      exclusion no-raise control。tests/test_calibrated_backend.py 的合成 fixture
      因原用單一 shape 的 selected_expert 探針而需更新（owner 授權）：改為兩個
      distinct shape 點，且第一點 expert_tokens=1 對齊 component 評估點的
      tokens_per_launch=1.0，使既有 MAPE 斷言完全不變、baseline 維持 317 全綠。
    correction_to_defect_2_fit_rule: >
      DEFECT_2 的 fit_rule「回歸被拒絕時退回 flat mean」自本 addendum 起僅適用於
      SHAPE_INSENSITIVE_OPERATIONS 名單內的 op（且那不是「被拒絕後退回」，是事前
      不做仿射）。名單外 op 一律 hard-fail（非物理 raise，且 single-shape 亦
      raise），不得退回常數。
    numerical_impact: "無。dequant 仍是 flat mean、per_token=0；其餘三個 op 在真實校準資料上皆有多個 shape 且物理。calibration/fits/v2 四項 FIT 側 MAPE 數字完全不變，只有 dequant 的 model_form 標籤改變。"
    status: "本階段登記變更；依 guide §8 規則，改碼前補登記。對應 DECISION_LOG P-012（含 single-shape follow-up）。"

commitments:
  - "本階段結束時不得宣稱任何 calibrated PASS；判定屬 STAGE_A4 sealed held-out。"
  - "所有殘差數字必須標注為 FIT 側，不得省略此限定詞。"
  - "任一缺陷若修正後仍不收斂（例如 DEFECT_2 的 dequant），記錄為未收斂並說明原因，不放寬門檻或挑選資料湊數。"
  - "既有的非物理解拒絕（slope<=0 或 intercept<0）保留，且新增的 gpu_service 回歸同樣受此拒絕規則約束。"
  - "src/edgeflow/calibrated_backend.py 只替換模型形式函式（_pcie_latency、_component_latency、fit_parameters 內 gpu_service 段落與新增的 _operand_tokens 輔助函式）；load_evidence、evaluate、evaluate_split、split 隔離與 sha256 驗證等既有保護不變動。"
