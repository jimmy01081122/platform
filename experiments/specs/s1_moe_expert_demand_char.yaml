experiment_id: s1_moe_expert_demand_char
revision: 1
status: active
question: >-
  For capacity-limited MoE inference (Switch-base-8), does the measured
  per-layer expert working set exceed a small fast-memory capacity, and is the
  expert demand temporally predictable enough to justify a prefetch/residency
  mechanism? Falsifiable: if active experts per layer are few and uncorrelated
  across layers, prefetching offers no advantage over on-demand loading.
platform_profile: discrete_edge_workstation
workload:
  id: moe_switch8_mbpp_s64_bs8_len64
