      status: UNSELECTED
      qualification_needed: exact SKU/runtime and bounded model-capacity proof
    - exact_product_name: NVIDIA RTX A6000
      vram_bytes: 51539607552
      status: UNSELECTED
      qualification_needed: exact runtime, topology, capacity and collector compatibility
    - exact_product_name: NVIDIA A100 40GB PCIe
      vram_bytes: 42949672960
      status: UNSELECTED
      qualification_needed: exact form factor, MIG/topology, runtime and model capacity
    - exact_product_name: NVIDIA A100 80GB PCIe
      vram_bytes: 85899345920
      status: UNSELECTED
      qualification_needed: exact form factor, MIG/topology, runtime and model capacity
