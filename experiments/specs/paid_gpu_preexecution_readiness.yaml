experiment_id: paid_gpu_preexecution_readiness_v1
stage: PRE_PAID_GPU
status: PREPARATION_ONLY_NOT_READY_NOT_SUBMITTED_NOT_AUTHORIZED
decision_baseline:
  active_stop_decision: D-062
  paid_gpu_execution: NO_GO
  h100: REMOVED_NOT_RUN
  exact_command: null
  gpu_authority: NONE
purpose: >
  Pre-register every offline, local, calibration, validation, packaging and
  approval dependency required before a future paid-GPU application can be
  considered. This file does not select, rent, start or authorize a GPU.
claim_boundary:
  establishes:
    - planned task, flow, evidence and decision fields
    - fail-closed paid-GPU entry criteria
  does_not_establish:
    - platform availability or price
    - exact GPU compatibility
    - calibration or validation pass
    - paid-GPU authorization
upstream_gates:
  - g25_s4_r4_immutable_source_freeze
  - g25_fresh_s4_r4_three_role_go_on_same_hashes
  - g25_gpt_5_6_sol_go_on_same_hashes_and_exact_command
  - g25_owner_exact_command_approval
  - local_rtx3050_g25_qualification_complete_and_qualified
  - fresh_g3_r5_pass
  - c1a_and_c1b_ir_audit_package_cleanroom_closure
  - cross_model_compatibility_and_bounded_local_rehearsal
candidate_gpus:
  primary_conditional:
    exact_product_name: NVIDIA RTX PRO 6000 Blackwell Workstation Edition
    vram_bytes: 103079215104
    role: existing_q0_q1_platform_or_bounded_repair_candidate
    status: STOPPED_NO_GO
    reason: Q1 failed all four MAPE gates; reuse requires a prospective missing-variable hypothesis
  alternatives:
    - exact_product_name: NVIDIA GeForce RTX 3090
