# ---------------------------------------------------------------------------
# Deliberately NOT migrated
# ---------------------------------------------------------------------------

not_migrated:
  - path: data/canonical/moe_routing_v1 + data/raw
    size: 439M
    reason: >
      Third-party HuggingFace dataset (core12345/MoE_expert_selection_trace) covering
      Qwen3-235B, DeepSeek-R1, Llama-4-Maverick, Kimi-K2. Not produced by this project,
      re-fetchable from HuggingFace, and carries router_scores=null throughout.
    recovery: manifests, stats, registry and fetch scripts are retained under configs/ and scripts/

  - path: gpu_run_package_v2/{.benchmark-runtime,models,cache,scheduler_runs}
    size: 16.7G
    reason: vendored Python runtime, model weights, HuggingFace cache, and CPU/mock scheduler runs
    recovery: rebuildable from pinned requirements and model registry

  - path: explorations/**/governance/history/**
    size: ~10M
    reason: >
      Recursive source snapshots (~29 KLOC duplicated). Also the direct cause of pytest
      basename collisions that broke collection at the source repo root.
    recovery: present in the frozen source repo

  - path: syn/**, sta/** generated netlists and tool logs
    size: ~85M
    reason: derived artifacts regenerable via scripts/reproduce_all.sh --with-sta in Docker
    recovery: result CSV/JSON summaries are retained; netlists regenerate from hardware/rtl

  - path: detailed_gpu/
    reason: >
      Contained only two orphaned .pyc files; the Accel-Sim normalization source was
      never committed. Registered as a deferred capability instead.

# ---------------------------------------------------------------------------
# Structural deviation from PLATFORM_FLOW_SPECIFICATION.md section 12
# ---------------------------------------------------------------------------

structure_deviation:
  spec_proposed: separate ir/ and engine/{core,single_gpu,residency,multi_domain} trees
  actual: source paths preserved verbatim (explorations/moe_cycle_simulator/phaseN, src/edgeflow)
  reason: >
    A rename to simulator/ was attempted during migration and reverted. Measured cost of
    renaming: 119 non-evidence files reference the literal path explorations/moe_cycle_simulator
    or the module path explorations.moe_cycle_simulator, including governance JSON whose
    hashes feed the project's own exact-file-set and ledger integrity checks. Two files
    inside the immutable evidence/ tree also record that path and must not be edited.
    Phase names are additionally baked into CMake target names (moe_sim_phase3,
    moe_sim_phase3_c) and exported C API symbols (moe_phase3_engine_create).
    Flattening src/edgeflow to edgeflow was likewise reverted: repo-root resolution walks
    up a fixed number of parents, so the missing src/ layer resolved the root to /home/a
    and broke schema lookup. pyproject.toml also declares packages.find where = ["src"].
  conceptual_mapping:
    ir: explorations/moe_cycle_simulator/phase1 + phase2
    engine_core: explorations/moe_cycle_simulator/phase3
    engine_single_gpu: explorations/moe_cycle_simulator/phase4
    engine_residency: explorations/moe_cycle_simulator/phase5
    engine_multi_domain: explorations/moe_cycle_simulator/phase6
    measurement_runners: explorations/moe_cycle_simulator/phase7
  revisit_when: >
    Only if a rename buys something concrete. It does not today, and it would invalidate
    governance hashes that the project uses to detect tampering.

# ---------------------------------------------------------------------------
# Post-migration baseline (measured 2026-08-17)
# ---------------------------------------------------------------------------

baseline:
  environment:
    python: 3.10.12
    venv: .venv
    pinned: {jsonschema: 4.24.0, pyarrow: 20.0.0}
    also_installed: [PyYAML, pytest, zstandard]
    required_env:
      PYTHONPATH: "$REPO:$REPO/src"
      PYTHONDONTWRITEBYTECODE: "1"
    pythondontwritebytecode_reason: >
      phase7_d0_r4 governance tests assert the exact file set of the application
      package. Auto-generated __pycache__ directories fail that assertion and
      accounted for 19 of the 23 failures seen immediately after migration.
  python_tests:
    tests: 96
    moe_cycle_simulator_tests: 36
    phase1_tests: 16
    phase2_tests: 43
    phase7_tests: "126 + 48 subtests"
    total: 317
    failures: 0
  cpp_ctest:
    phase3: "2/2"
    phase4: "3/3"
    phase5: "4/4"
    phase6: "5/5"
    failures: 0
  resolved_pre_existing_failures: >
    The source repo had 45 failures caused solely by an unmet dependency pin
    (jsonschema 3.2.0 installed vs 4.24.0 required) across phase1/phase2, plus
    broken pytest collection at repo root from the recursive governance/history
    snapshots. Installing the pinned versions and excluding history resolved both.
