      服務時間走 phase4 (契約正確層, 亦即 PHASE3_RESULT.md 自述服務時間屬 Phase 4)。
      phase3 kService 是否要字面修改 (需重開 r5 review + 更新 checksums) 留給 owner。
      本 ledger 對 A3 的三條 verification (SIM0/SIM1/health) 全部滿足。
