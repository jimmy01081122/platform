      Operation (work = object bytes), phase4 service_duration 以量測 PCIe 頻寬
      28298591668 B/s 轉為服務時長, 單 H2D lane 串行。驗證: 每物件 H2D =
      90823799123064345/7295 = 12450143814087 fs, 與 A2 PlatformIR 校準
      h2d_expert_object_service_min duration_fs 完全相符。counters 與時序無關 (純順序
