      名單 SHAPE_INSENSITIVE_OPERATIONS (dequant), 非名單 op 的非物理擬合一律
      raise; self-check 已擴充到覆蓋 production path (fit_parameters, 非只
      _line_fit)。狀態暫留 IN_PROGRESS: 尚待 v2 preregistration 涵蓋 reviewer
      的其餘結論 (PCIe two-regime、component predictor 的 prefill-only 門檻、
      MoE replay 的 routing/permutation operator) 後再重擬合。本輪不宣稱任何
      calibrated PASS。
      [2026-08-18 更新] v2 preregistration 已撰寫:
      experiments/specs/cal_model_form_repair_v2.yaml (created_at 2026-08-18T15:35:15Z,
      早於任何 v3 fit 輸出——目前 calibration/fits/ 僅有 v2)。內含四候選的模型形式、
      參數化、擬合協定與**事前寫死的三值接受判準** (PCIe ACCEPT bar、component
