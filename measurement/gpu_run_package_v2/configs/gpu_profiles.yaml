schema_version: gpu-profiles-v2
policy:
  active_execution_decision: D-062
  paid_execution_default: denied_until_superseded
  exact_sku_required: true
  reject_generic_names:
    - RTX PRO 6000
    - H100
    - A100
    - V100
  prohibit_topology_inference: true
  topology_source: required_preflight
  unknown_value_policy: use_null_and_required_preflight
  fit_decision:
    theoretical_weight_size_is_not_sufficient: true
    required_checks:
      - weight_size_estimate
      - runtime_overhead_estimate
      - allocation_smoke_test
      - short_context_generation_smoke_test
      - profiler_compatibility_test
  result_scope:
    rtx_3050_scaling_to_other_gpus: prohibited
    h100_as_only_edge_workstation_representative: prohibited

execution_modes:
  native_executable: Full executable model without offload.
  quantized_executable: Executable model using an explicitly recorded quantization configuration.
  cpu_offload: Executable model with an explicitly recorded CPU/GPU device map.
  layer_replay: Selected layer or kernel replay tied to the same workload identity.
  trace_replay: Routing trace plus calibrated service model; not an end-to-end model run.
  capacity_boundary: Preserve failed allocation or execution evidence; do not delete the matrix row.

model_classes:
  M0:
    purpose: correctness_and_pipeline
    examples: [small_switch_model, OLMoE-1B-7B]
  M1:
    purpose: medium_executable_moe
    examples: [DeepSeek-MoE-16B, Qwen3-30B-A3B]
  M2:
    purpose: workstation_vram_and_offload_pressure
    examples: [Mixtral-8x7B]
  M3:
    purpose: large_trace_derived_workload
    examples: [DeepSeek-R1-trace, Qwen3-235B-trace, frozen-large-MoE-holdout-trace]
    full_single_gpu_execution_required: false

profiles:
  rtx3050_6gb:
    enabled: true
    execution_enabled: true
    execution_scope: local_pipeline_smoke_only
    optional: false
    exact_sku: NVIDIA GeForce RTX 3050
    accepted_name_regex: '^NVIDIA GeForce RTX 3050(?: Laptop GPU)?$'
    vram_gib: 6
    form_factor: null
    interconnect: null
    hardware_requirements: {compute_capability_min: 8.6, pcie_generation_min: 3, pcie_width_min: 4}
    mig:
      supported: false
      enabled: false
    required_preflight: [exact_product_name, pci_bus_id, vram_total, form_factor, pcie_link_state]
    role:
      trust: local_development_only
      functions: [pipeline_validation, trace_collector_development, cuda_runtime_smoke, low_vram_pressure]
      split: none
    default_trace_profile: standard
    model_policy:
      M0: {default: native_executable, fallback: [quantized_executable, capacity_boundary]}
      M1: {default: quantized_executable, fallback: [cpu_offload, layer_replay, capacity_boundary]}
      M2: {default: cpu_offload, fallback: [layer_replay, trace_replay, capacity_boundary]}
      M3: {default: trace_replay, fallback: [layer_replay, capacity_boundary]}

  rtx3090_24gb:
