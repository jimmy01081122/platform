schema_version: model-registry-v2
registry_status: pre_calibration

evidence_policy:
  measured_values_require_artifact: true
  estimate_shape:
    required_fields: [value, evidence, basis]
    evidence_value: estimate
  unknown_values: null
  revision_policy: >-
    Every checkpoint has an explicit revision field. A null revision is unresolved
    and must be pinned to an immutable commit hash before weights are acquired.
  m3_single_gpu_full_execution: prohibited

precision_taxonomy:
  fp32:
    family: floating_point
    nominal_bits_per_weight: 32
  bf16:
    family: floating_point
    nominal_bits_per_weight: 16
  fp16:
    family: floating_point
    nominal_bits_per_weight: 16
  fp8:
    family: floating_point
    nominal_bits_per_weight: 8
    checkpoint_layout_required: true
  awq:
    family: weight_only_quantization
    distinct_from: [gptq, compressed_tensors]
    checkpoint_layout_required: true
  gptq:
    family: weight_only_quantization
    distinct_from: [awq, compressed_tensors]
    checkpoint_layout_required: true
  compressed_tensors:
    family: compressed_tensors
    distinct_from: [awq, gptq]
    checkpoint_layout_required: true

comparison_policy:
  same_precision_gpu_speed_comparison_only: true
  cross_precision_results_are_ablation_only: true
  prohibited_claim: >-
    Results produced with different precision or checkpoint formats must not be
    presented as a pure GPU speed comparison.
  required_match_fields:
    - model_id
    - revision
    - precision_id
    - quantization_method
    - checkpoint_layout
    - workload_hash
    - runtime_backend

